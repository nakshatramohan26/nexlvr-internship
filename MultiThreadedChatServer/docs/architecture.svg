<text text-anchor="middle" x="1020.5" y="-413.79" font-family="Helvetica,sans-Serif" font-size="11.00">SHARED STATE (ChatServer.java)</text>
<text text-anchor="middle" x="1020.5" y="-401.79" font-family="Helvetica,sans-Serif" font-size="11.00">List&lt;ClientHandler&gt; clients</text>
<text text-anchor="middle" x="1020.5" y="-389.79" font-family="Helvetica,sans-Serif" font-size="11.00">guarded by synchronized(clientsLock)</text>
<text text-anchor="middle" x="1020.5" y="-364.79" font-family="Helvetica,sans-Serif" font-size="11.00">registerClient()</text>
<text text-anchor="middle" x="1020.5" y="-352.79" font-family="Helvetica,sans-Serif" font-size="11.00">removeClient()</text>
<text text-anchor="middle" x="1020.5" y="-340.79" font-family="Helvetica,sans-Serif" font-size="11.00">broadcast() = copy list under lock,</text>
<text text-anchor="middle" x="1020.5" y="-328.79" font-family="Helvetica,sans-Serif" font-size="11.00">then send outside the lock</text>
</g>

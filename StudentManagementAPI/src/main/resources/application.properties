spring.application.name=StudentManagementAPI

# Change this if port 8080 is already in use, e.g. server.port=8081
server.port=8080

# Never send stack traces or internal exception messages in error responses
server.error.include-stacktrace=never
server.error.include-message=never

# Swagger UI: http://localhost:8080/swagger-ui/index.html
# OpenAPI JSON: http://localhost:8080/v3/api-docs
# Show endpoints in the order they are written in the controller
springdoc.swagger-ui.operations-sorter=method
